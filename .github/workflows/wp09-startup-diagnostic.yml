name: WP09 focused UI diagnostic

on:
  push:
    branches: [codex/prod-wp09-journeys]
    paths:
      - .github/workflows/wp09-startup-diagnostic.yml
      - ui/e2e/fixtures/app*.ts
      - ui/e2e/fixtures/app*.mjs
      - ui/e2e/fixture-isolation.spec.ts
  workflow_dispatch:
    inputs:
      sha:
        description: Exact source SHA (diagnostic only, not release acceptance)
        required: true
        type: string

permissions:
  contents: read

jobs:
  startup:
    name: WP09 focused UI diagnostic (not release CI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const actual = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SHA ?? "") || actual !== process.env.EXPECTED_SHA) throw Error("Diagnostic SHA mismatch");
          '
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm --prefix ui ci --no-audit --no-fund
      - name: Install browser for the observed UI failures
        run: npx --prefix ui playwright install --with-deps chromium
      - run: npm run build:server
      - run: npm run build:cli
      - name: Build fixture UI
        id: fixture_build
        run: npm --prefix ui run build:fixture
      - name: Diagnose observed UI failures with required isolation dependency
        timeout-minutes: 8
        env:
          WP08_BUILD_COMMAND: npm --prefix ui run build:fixture
          WP08_BUILD_OUTCOME: ${{ steps.fixture_build.outcome }}
        run: npm --prefix ui run test:e2e -- --project=journeys --grep 'Node default and explicit fit|composition interrupted|WP01 reference controls' --reporter=line
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wp09-ui-diagnostic-${{ inputs.sha || github.sha }}-${{ github.run_id }}
          path: ui/test-results/
          if-no-files-found: warn
          retention-days: 7

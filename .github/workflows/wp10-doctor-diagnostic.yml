name: WP10 doctor diagnostic
on:
  push:
    branches: [codex/prod-wp10-diagnostics]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact diagnostic source SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm run build:server
      - run: npm run build:cli
      - run: npm --prefix ui run build
      - name: Focused doctor and logger regression checks
        run: node --import tsx --test tests/doctor-runtime.test.ts tests/doctor-report.test.ts tests/doctor-provider-contract.test.ts tests/logging.test.ts
      - name: Actual emitted CLI JSON, exit and offline boundary
        run: node --import tsx --input-type=module -e 'import { verifyEmittedDoctorCli } from "./tests/doctor-report.test.ts"; await verifyEmittedDoctorCli();'
      - name: Existing human doctor package-engine contract
        run: node --import tsx --test --test-name-pattern="should run doctor" tests/bin.test.js

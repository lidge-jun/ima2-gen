name: WP11 Windows diagnostic
on:
  push:
    branches: [codex/prod-wp11-installation]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact diagnostic source SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Exact diagnostic checkout
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        run: node scripts/assert-ci-sha.mjs
      - run: npm install -g npm@11.18.0
      - run: npm ci
      - run: npm run build:server
      - name: Diagnose the one remaining MCP timeout
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawn } from 'node:child_process';
          for (let batch = 0; batch < 10; batch++) {
            const codes = await Promise.all(Array.from({ length: 3 }, (_, lane) => new Promise(resolve => {
              const child = spawn(process.execPath, ['--experimental-test-module-mocks', '--import', 'tsx', '--test', 'tests/cli-model-resolver.test.ts']);
              let output = '';
              child.stdout.on('data', chunk => { output += chunk; });
              child.stderr.on('data', chunk => { output += chunk; });
              child.on('error', error => { console.error(error); resolve(1); });
              child.on('close', code => { console.log(JSON.stringify({ batch, lane, code })); if (code !== 0) console.log(output); resolve(code ?? 1); });
            })));
            if (codes.some(code => code !== 0)) { process.exitCode = 1; break; }
          }
          JS

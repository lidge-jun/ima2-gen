name: WP11 Windows diagnostic
on:
  push:
    branches: [codex/prod-wp11-installation]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact diagnostic source SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Exact diagnostic checkout
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        run: node scripts/assert-ci-sha.mjs
      - run: npm install -g npm@11.18.0
      - run: npm ci
      - name: Diagnose the one remaining MCP timeout
        run: node --experimental-test-module-mocks --import tsx --test tests/cli-model-resolver.test.ts

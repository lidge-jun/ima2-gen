name: PR Fast Gate

permissions:
  contents: read

on:
  pull_request: {}

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    name: PR fast gate
    runs-on: ubuntu-latest
    # The retained UI suite alone took16.1min at WP11. Budget the complete job;
    # individual test deadlines and all cases remain unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blob budget uses HEAD^1; release provenance also needs older ancestors.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Assert PR merge checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/assert-ci-sha.mjs
      - name: Record PR merge and head identities
        env:
          MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --input-type=module -e 'console.log(JSON.stringify({mergeSha:process.env.MERGE_SHA,prHeadSha:process.env.PR_HEAD_SHA}))'
      - name: Pin npm
        run: npm install -g npm@11.18.0
      - name: Enforce the new blob budget
        run: node scripts/check-new-blob-budget.mjs --base HEAD^1
      - name: Install root deps
        run: npm ci
      - name: Install ui deps
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Structure line-count drift
        run: node scripts/refresh-structure-line-counts.mjs --check
      - name: Provider registry generated-file drift
        run: node scripts/generate-provider-types.mjs --check
      - name: Native dependency smoke
        run: npm run test:native-deps
      - name: Install policy contract
        run: npm run test:install-policy
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:tests
      - name: Test inventory
        run: npm run test:inventory
      - name: Build server
        run: npm run build:server
      - name: Build cli
        run: npm run build:cli
      - name: Build ui
        run: npm --prefix ui run build
      # Runs after the builds: npm pack --ignore-scripts skips prepack, so
      # ui/dist has to already exist or the measurement reads far too small.
      - name: Enforce the npm package size budget
        run: node scripts/collect-package-metrics.mjs package
      # The full suite stays in the fast gate: 355 files run in 79s on Ubuntu,
      # so sharding or a unit/integration split would add structure without
      # buying time. What the fast gate drops is the Windows lane and the two
      # package smokes, which cost 573s of the 831s Windows job.
      - name: Run tests
        run: npm test
        timeout-minutes: 5
      - name: Lint package.json
        run: npm run lint:pkg
      - name: Install Playwright Chromium
        run: npx --prefix ui playwright install --with-deps chromium
      - name: Typecheck E2E
        run: npm --prefix ui run typecheck:e2e
      - name: Build isolated fixture UI
        id: wp08_ui_build
        run: npm --prefix ui run build:fixture
      - name: Run frontend e2e
        env:
          WP08_BUILD_COMMAND: npm --prefix ui run build:fixture
          WP08_BUILD_OUTCOME: ${{ steps.wp08_ui_build.outcome }}
        run: npm --prefix ui run test:e2e
      - name: Upload WP09 isolation and journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp09-journeys-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ui/test-results/**/wp09-*.png
            ui/test-results/**/wp09-*.json
            ui/test-results/**/wp12-*.png
            ui/test-results/**/wp12-*.json
            ui/dist/.ima2-ui-build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload composer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp08-composer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/test-results/**/wp08-*.png
            ui/test-results/**/wp08-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload WP08c evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp08c-provider-display-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/test-results/**/wp08c-*.png
            ui/test-results/**/wp08c-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload provider surface visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp01-provider-surface-visual
          path: ui/test-results/**/wp01-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp02-selection-evidence
          path: |
            ui/test-results/**/wp02-*.png
            ui/test-results/**/wp02-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload execution error evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp03-error-evidence
          path: |
            ui/test-results/**/wp03-*.png
            ui/test-results/**/wp03-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-fast-e2e-failure-context
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

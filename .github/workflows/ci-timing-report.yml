name: CI Timing Report

# #148 asked for step-level timings in the workflow summary. A job cannot read
# its own completed_at, and there is no API to edit a finished run's summary, so
# this observer reads the jobs API after the run completes and writes the table
# to its own summary. It never checks out source, so a fork PR cannot reach it.
on:
  workflow_run:
    workflows: [CI, PR Fast Gate]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    name: Summarize CI timings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write completed job and step durations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="$RUNNER_TEMP/ci-jobs.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '.' > "$jobs_json"

          {
            echo "# CI timing report"
            echo
            echo "- Source: [$RUN_NAME run $RUN_ID]($RUN_URL)"
            echo "- Event: $RUN_EVENT"
            echo "- SHA: $RUN_SHA"
            echo
            echo "## Job durations"
            echo
            echo "| Job | Duration | Conclusion |"
            echo "|---|---:|---|"
            jq -r '
              .[]
              | select(.started_at != null and .completed_at != null)
              | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) as $seconds
              | "| \(.name) | \($seconds)s | \(.conclusion) |"
            ' "$jobs_json"
            echo
            echo "## Step durations"
            echo
            echo "| Job | Step | Duration | Conclusion |"
            echo "|---|---|---:|---|"
            jq -r '
              .[] as $job
              | $job.steps[]
              | select(.started_at != null and .completed_at != null)
              | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) as $seconds
              | "| \($job.name) | \(.name) | \($seconds)s | \(.conclusion) |"
            ' "$jobs_json"
          } >> "$GITHUB_STEP_SUMMARY"
